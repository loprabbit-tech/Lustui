[package]
name = "lustui"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tower-http = { version = "0.5", features = ["fs"] }
clap = { version = "4.4", features = ["derive"] }
open = "5.0"
rust-embed = "8.0"
mime_guess = "2.0.5"
